                                    <div className="w-full aspect-[16/9] rounded-xl bg-[#0a0a0a] border border-neutral-800 relative overflow-hidden flex flex-col mt-auto shadow-2xl">
                                         <div className="absolute inset-0 opacity-20 bg-[size:20px_20px] bg-[linear-gradient(rgba(59,130,246,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(59,130,246,0.1)_1px,transparent_1px)]"></div>
                                         <div className="absolute inset-0 flex items-center justify-center">
                                             <div className="w-2/3 h-px bg-neutral-700 relative">
                                                 <div className="absolute top-1/2 left-0 w-2 h-2 bg-[#E8E6D9] rounded-full shadow-[0_0_10px_#E8E6D9] animate-[ping_2s_linear_infinite] transform -translate-y-1/2"></div>
                                                 <div className="absolute top-1/2 right-0 w-8 md:w-12 h-1 bg-gradient-to-l from-blue-500 to-transparent transform -translate-y-1/2 animate-[pulse_1s_ease-in-out_infinite]"></div>
                                             </div>
                                         </div>
                                         <div className="absolute inset-0 flex items-center justify-between px-6 md:px-20">
                                             <div className="relative z-10 flex flex-col items-center gap-2 md:gap-4">
                                                 <div className="w-10 h-10 md:w-16 md:h-16 rounded-xl border border-[#E8E6D9]/30 bg-[#E8E6D9]/5 backdrop-blur-sm flex items-center justify-center">
                                                     <MapPin size={16} className="text-[#E8E6D9] md:w-6 md:h-6" />
                                                 </div>
                                                 <span className="text-[8px] md:text-[10px] uppercase tracking-[0.2em] font-bold text-[#E8E6D9]">Senopati</span>
                                             </div>
                                             <div className="relative z-10 flex flex-col items-center gap-2 md:gap-4">
                                                 <div className="w-10 h-10 md:w-16 md:h-16 rounded-xl border border-blue-500/30 bg-blue-500/5 backdrop-blur-sm flex items-center justify-center">
                                                     <MapPin size={16} className="text-blue-500 md:w-6 md:h-6" />
                                                 </div>
                                                 <span className="text-[8px] md:text-[10px] uppercase tracking-[0.2em] font-bold text-blue-500">PIK</span>
                                             </div>
                                         </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const QuizSection = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [scores, setScores] = useState({ josephine: 0, gabriele: 0 });
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);

            const questions = [
                {
                    title: "The Friday Night Call",
                    description: "It's 8 PM. Where are we heading?",
                    optionA: { label: "Josephine", text: "A private room at a jazz bar, a bottle of red, and 3 close friends.", icon: Wine },
                    optionB: { label: "Gabriele", text: "A table at the newest club, a bottle of tequila, and whoever shows up.", icon: Music }
                },
                {
                    title: "The Commute",
                    description: "Stuck in traffic. What's the mood?",
                    optionA: { label: "Josephine", text: "Headphones on, listening to a podcast, watching the rain.", icon: Headphones },
                    optionB: { label: "Gabriele", text: "Group chat blowing up, planning the pre-drinks.", icon: Zap }
                },
                {
                    title: "The Aesthetic",
                    description: "Your ideal space looks like...",
                    optionA: { label: "Josephine", text: "Earth tones, linen, candles, scent of sandalwood.", icon: Wind },
                    optionB: { label: "Gabriele", text: "Chrome, leather, strobes, scent of smoke and citrus.", icon: Flame }
                }
            ];

            const handleAnswer = (type) => {
                setScores(prev => ({ ...prev, [type]: prev[type] + 1 }));
                setCurrentStep(prev => prev + 1);
            };

            const handleEmailSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            const winner = scores.josephine > scores.gabriele ? 'Josephine' : 'Gabriele';

            return (
                <section id="quiz" className="py-16 md:py-24 bg-neutral-900 border-t border-neutral-800 scroll-mt-20">
                    <div className="max-w-6xl mx-auto px-4 md:px-6">
                        <div className="text-center mb-10 md:mb-16">
                            <span className="text-blue-500 font-bold tracking-widest text-[10px] md:text-xs uppercase mb-2 block">Step Into The World</span>
                            <h2 className="text-3xl md:text-7xl font-bold mb-3 md:mb-4 text-white">Define Your Identity</h2>
                            <p className="text-neutral-400 text-sm md:text-lg">Which Sister Are You? The result unlocks your invitation.</p>
                        </div>

                        <div className="bg-neutral-800 rounded-2xl md:rounded-3xl overflow-hidden shadow-2xl border border-neutral-700 min-h-[500px] md:min-h-[600px] flex flex-col relative">
                            <div className="absolute inset-0 opacity-5 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
                            
                            {currentStep < 3 ? (
                                <div className="flex-1 flex flex-col relative z-10">
                                    <div className="w-full h-1 bg-neutral-900">
                                        <div className="h-full bg-blue-500 transition-all duration-500 ease-out" style={{ width: `${((currentStep) / 3) * 100}%` }}></div>
                                    </div>

                                    <div className="flex-1 flex flex-col items-center justify-center p-6 md:p-16 text-center">
                                        <div className="mb-6 md:mb-8">
                                            <span className="text-[10px] md:text-xs font-bold uppercase tracking-[0.3em] text-neutral-500">Question {currentStep + 1} / 3</span>
                                        </div>
                                        
                                        <h2 className="text-2xl md:text-5xl font-bold mb-4 md:mb-6 text-white">{questions[currentStep].title}</h2>
                                        <p className="text-neutral-400 mb-8 md:mb-16 text-base md:text-xl">{questions[currentStep].description}</p>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 w-full max-w-4xl">
                                            {/* Option A */}
                                            <button onClick={() => handleAnswer('josephine')} className="group relative bg-[#E8E6D9] text-[#2C2C2C] p-6 md:p-10 rounded-xl md:rounded-2xl text-left hover:scale-[1.02] transition-all duration-300 shadow-lg active:scale-95">
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className="font-serif italic text-xs md:text-sm uppercase tracking-widest text-[#6B705C] block">Team Josephine</span>
                                                    <div className="text-[#6B705C] opacity-50 group-hover:opacity-100">
                                                        {React.createElement(questions[currentStep].optionA.icon, { className: "w-6 h-6 md:w-8 md:h-8" })}
                                                    </div>
                                                </div>
                                                <p className="font-serif text-lg md:text-2xl leading-tight">{questions[currentStep].optionA.text}</p>
                                            </button>

                                            {/* Option B */}
                                            <button onClick={() => handleAnswer('gabriele')} className="group relative bg-black border border-neutral-700 text-white p-6 md:p-10 rounded-xl md:rounded-2xl text-left hover:scale-[1.02] transition-all duration-300 hover:border-blue-500 shadow-lg active:scale-95">
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className="font-sans font-black text-xs md:text-sm uppercase tracking-widest text-blue-500 block">Team Gabriele</span>
                                                    <div className="text-blue-500 opacity-50 group-hover:opacity-100">
                                                        {React.createElement(questions[currentStep].optionB.icon, { className: "w-6 h-6 md:w-8 md:h-8" })}
                                                    </div>
                                                </div>
                                                <p className="font-sans font-bold text-lg md:text-2xl leading-tight italic">{questions[currentStep].optionB.text}</p>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                // RESULT
                                <div className="flex-1 flex flex-col md:flex-row h-full relative z-10">
                                    {/* CARD CONTAINER - REDUCED PADDING & REMOVED FIXED MAX-WIDTH */}
                                    <div className="w-full md:w-5/12 p-6 md:p-12 flex flex-col justify-center items-center relative overflow-hidden bg-[#111] border-b md:border-b-0 md:border-r border-white/5">
                                        <div className="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/dark-leather.png')]"></div>
                                        
                                        {/* THE CARD - REMOVED max-w-sm */}
                                        <div className={`relative w-full aspect-[1.586/1] rounded-xl md:rounded-2xl p-4 md:p-8 shadow-2xl overflow-hidden group ${winner === 'Josephine' ? 'bg-gradient-to-br from-[#F5F5F0] via-[#E6E4D5] to-[#CccbBa] text-[#4A483F]' : 'bg-gradient-to-br from-[#1a1a1a] via-[#0a0a0a] to-black text-white border border-white/10'}`}>
                                            <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/noise.png')]"></div>
                                            <div className="flex justify-between items-start mb-4 md:mb-8 relative z-10">
                                                <div className="flex items-center gap-2 md:gap-3">
                                                    <div className={`w-8 h-6 md:w-12 md:h-9 rounded md:rounded-md bg-gradient-to-br ${winner === 'Josephine' ? 'from-yellow-100 to-yellow-500' : 'from-gray-300 to-gray-400'} flex items-center justify-center border border-black/10`}>
                                                        <div className="w-5 h-3 md:w-8 md:h-5 border border-black/20 grid grid-cols-2 opacity-50"></div>
                                                    </div>
                                                    <Wifi className={`w-4 h-4 md:w-6 md:h-6 rotate-90 opacity-60 ${winner === 'Josephine' ? 'text-[#4A483F]' : 'text-white'}`} />
                                                </div>
                                                <div className="font-bold tracking-[0.2em] uppercase text-[8px] md:text-xs opacity-80">Seeing Double</div>
                                            </div>
                                            <div className="mt-auto mb-2 md:mb-4 relative z-10">
                                                <div className="text-[6px] md:text-[10px] uppercase tracking-[0.2em] opacity-60 mb-1">Identity</div>
                                                <h2 className={`text-lg md:text-3xl tracking-widest uppercase truncate ${winner === 'Josephine' ? 'font-serif' : 'font-sans font-black italic'}`}>{winner}</h2>
                                            </div>
                                            <div className="flex justify-between items-end relative z-10">
                                                <div className="font-mono text-[10px] md:text-base tracking-[0.15em] opacity-80">0000 8842 2025 {winner === 'Josephine' ? '0001' : '0002'}</div>
                                                <div className="flex flex-col items-end">
                                                    <span className="text-[5px] md:text-[8px] uppercase tracking-widest opacity-60">Valid Thru</span>
                                                    <span className="font-mono text-[8px] md:text-[10px] font-bold">FOREVER</span>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="mt-6 md:mt-8 text-[10px] md:text-xs text-neutral-500 uppercase tracking-widest font-mono">{winner === 'Josephine' ? 'The Pearl Card' : 'The Obsidian Card'}</p>
                                    </div>

                                    <div className="w-full md:w-7/12 p-8 md:p-20 bg-neutral-900 flex flex-col justify-center">
                                        <div className="mb-6 md:mb-8">
                                            <h3 className="text-blue-500 font-bold uppercase tracking-widest text-[10px] md:text-xs mb-2 flex items-center gap-2">
                                                <Star size={12} fill="currentColor" /> Unforgettable Experience
                                            </h3>
                                            <h2 className="text-3xl md:text-5xl font-bold text-white mb-4 md:mb-6">Secure Access</h2>
                                            <p className="text-neutral-400 text-sm md:text-lg leading-relaxed mb-6">
                                                Matched with Team {winner}. This is your key to exclusive events.
                                                <span className="block mt-2 text-white font-medium">Warning: Capacity strictly limited.</span>
                                            </p>
                                        </div>
                                        
                                        {submitted ? (
                                            <div className="p-6 bg-green-500/10 border border-green-500/20 rounded-xl flex items-center gap-4 animate-in">
                                                <div className="bg-green-500 text-black p-2 rounded-full"><Check size={20} /></div>
                                                <div><h4 className="text-green-500 font-bold">You're locked in.</h4><p className="text-green-500/80 text-sm">Check your inbox.</p></div>
                                            </div>
                                        ) : (
                                            <form onSubmit={handleEmailSubmit} className="w-full">
                                                <div className="flex flex-col gap-4">
                                                    <input type="email" required placeholder="Enter your email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-neutral-800 border border-neutral-700 text-white p-4 rounded-xl focus:outline-none focus:border-blue-500 transition-all placeholder-neutral-500" />
                                                    <button type="submit" className={`w-full py-4 rounded-xl text-sm md:text-base uppercase font-black tracking-[0.2em] transition-all active:scale-95 ${winner === 'Josephine' ? 'bg-[#E8E6D9] text-[#2C2C2C]' : 'bg-blue-600 text-white'}`}>Claim My Spot</button>
                                                </div>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const LeaderboardSection = () => {
            const [josephineCount, setJosephineCount] = useState(1240);
            
            useEffect(() => {
                const interval = setInterval(() => {
                   if (Math.random() > 0.5) setJosephineCount(c => c + 1);
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            const total = josephineCount + 1195;
            const josephinePercent = (josephineCount / total) * 100;

            return (
                <section id="leaderboard" className="py-16 md:py-24 bg-black relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
                    <div className="max-w-4xl mx-auto px-6 relative z-10 text-center">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-green-500/30 bg-green-500/10 text-green-400 text-[10px] font-bold uppercase tracking-widest mb-6 md:mb-10 animate-pulse">
                            <div className="w-2 h-2 rounded-full bg-green-500"></div>Live Pulse
                        </div>
                        <h2 className="text-3xl md:text-6xl font-black text-white mb-4 uppercase italic">Who Rules Jakarta?</h2>
                        <div className="flex justify-between items-end mb-4 md:mb-6 font-mono border-b border-neutral-800 pb-2">
                            <div className="text-left">
                                <div className="text-[#E8E6D9] text-2xl md:text-5xl font-bold">{josephineCount.toLocaleString()}</div>
                                <div className="text-[#6B705C] text-[10px] md:text-xs uppercase tracking-[0.2em] mt-1">Chill</div>
                            </div>
                            <div className="text-right">
                                <div className="text-blue-500 text-2xl md:text-5xl font-bold">1,195</div>
                                <div className="text-blue-800 text-[10px] md:text-xs uppercase tracking-[0.2em] mt-1">Chaos</div>
                            </div>
                        </div>
                        <div className="w-full h-6 md:h-12 bg-neutral-900 flex relative border border-neutral-800">
                            <div className="h-full bg-[#E8E6D9] transition-all duration-1000 ease-out" style={{ width: `${josephinePercent}%` }}></div>
                            <div className="h-full bg-blue-600 transition-all duration-1000 ease-out" style={{ width: `${100 - josephinePercent}%` }}></div>
                            <div className="absolute top-0 bottom-0 left-1/2 w-1 bg-black z-10 transform -translate-x-1/2"></div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
             <footer className="py-12 md:py-20 px-6 border-t border-neutral-800 text-center text-neutral-500 text-sm bg-black">
                <p className="uppercase tracking-[0.3em] mb-6 text-[10px] md:text-xs font-bold text-neutral-600">Josephine x Gabriele Present</p>
                <div className="flex justify-center mb-8"><SeeingDoubleLogo className="text-3xl md:text-6xl" /></div>
                <div className="flex justify-center gap-6 mb-8">
                    {[1,2,3].map(i => <span key={i} className="w-1.5 h-1.5 bg-neutral-800 rounded-full"></span>)}
                </div>
                <p className="text-xs">© 2025 Seeing Double Jakarta.</p>
            </footer>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
